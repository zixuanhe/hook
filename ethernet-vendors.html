<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Linux Ethernet Vendors</title>
  <style>
    :root {
      color-scheme: light;
      --bg: #f7f8fb;
      --panel: #ffffff;
      --text: #1f2937;
      --muted: #6b7280;
      --border: #d9dee8;
      --accent: #0f766e;
      --accent-soft: #d9f4ef;
      --yes: #047857;
      --no: #9f1239;
      --row: #fbfcfe;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      background: var(--bg);
      color: var(--text);
      font: 14px/1.45 ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    main {
      width: min(1180px, calc(100vw - 32px));
      margin: 0 auto;
      padding: 28px 0 36px;
    }

    h1 {
      margin: 0 0 18px;
      font-size: 28px;
      font-weight: 720;
      letter-spacing: 0;
    }

    .toolbar {
      display: grid;
      grid-template-columns: minmax(220px, 1fr) auto auto auto;
      gap: 10px;
      align-items: center;
      margin-bottom: 14px;
    }

    .search {
      width: 100%;
      min-height: 38px;
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 8px 11px;
      color: var(--text);
      background: var(--panel);
      font: inherit;
      outline: none;
    }

    .search:focus {
      border-color: var(--accent);
      box-shadow: 0 0 0 3px var(--accent-soft);
    }

    .check {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      min-height: 38px;
      padding: 0 10px;
      border: 1px solid var(--border);
      border-radius: 6px;
      background: var(--panel);
      color: var(--text);
      white-space: nowrap;
      user-select: none;
    }

    .check input {
      width: 16px;
      height: 16px;
      accent-color: var(--accent);
    }

    .count {
      min-width: 86px;
      color: var(--muted);
      text-align: right;
      font-variant-numeric: tabular-nums;
    }

    .table-wrap {
      overflow: auto;
      border: 1px solid var(--border);
      border-radius: 8px;
      background: var(--panel);
    }

    table {
      width: 100%;
      min-width: 820px;
      border-collapse: collapse;
    }

    th,
    td {
      padding: 10px 12px;
      border-bottom: 1px solid var(--border);
      text-align: left;
      vertical-align: middle;
    }

    th {
      position: sticky;
      top: 0;
      z-index: 1;
      background: #eef2f7;
      color: #374151;
      font-size: 12px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0;
    }

    tbody tr:nth-child(even) {
      background: var(--row);
    }

    tbody tr:last-child td {
      border-bottom: 0;
    }

    .vendor {
      font-weight: 620;
    }

    .pill {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-width: 44px;
      min-height: 24px;
      padding: 2px 8px;
      border-radius: 999px;
      font-size: 12px;
      font-weight: 700;
    }

    .pill.yes {
      color: var(--yes);
      background: #dff7ea;
    }

    .pill.no {
      color: var(--no);
      background: #fde5eb;
    }

    .empty {
      padding: 26px 12px;
      color: var(--muted);
      text-align: center;
    }

    @media (max-width: 720px) {
      main {
        width: min(100vw - 20px, 1180px);
        padding-top: 18px;
      }

      h1 {
        font-size: 22px;
      }

      .toolbar {
        grid-template-columns: 1fr;
      }

      .count {
        text-align: left;
      }
    }
  </style>
</head>
<body>
  <main>
    <h1>Linux Ethernet Vendors</h1>
    <div class="toolbar" aria-label="Table filters">
      <input id="search" class="search" type="search" placeholder="Search vendor or config symbol" autocomplete="off">
      <label class="check">
        <input id="chineseOnly" type="checkbox">
        Chinese based
      </label>
      <label class="check">
        <input id="supportedOnly" type="checkbox">
        HookOS 6.6 supported
      </label>
      <div id="count" class="count" aria-live="polite"></div>
    </div>

    <div class="table-wrap">
      <table>
        <thead>
          <tr>
            <th>Vendor name</th>
            <th>Chinese based</th>
            <th>Supported in HookOS 6.6</th>
            <th>1Gb or faster</th>
            <th>Config symbol</th>
          </tr>
        </thead>
        <tbody id="vendorRows"></tbody>
      </table>
    </div>
  </main>

    const rows = document.getElementById("vendorRows");
    const search = document.getElementById("search");
    const chineseOnly = document.getElementById("chineseOnly");
    const supportedOnly = document.getElementById("supportedOnly");
    const count = document.getElementById("count");

    function pill(value) {
      return `<span class="pill ${value ? "yes" : "no"}">${value ? "Yes" : "No"}</span>`;
    }

    function render() {
      const term = search.value.trim().toLowerCase();
      const filtered = vendors.filter(([name, chinese, supported, symbol]) => {
        const matchesSearch = !term ||
          name.toLowerCase().includes(term) ||
          symbol.toLowerCase().includes(term);
        return matchesSearch &&
          (!chineseOnly.checked || chinese) &&
          (!supportedOnly.checked || supported);
      });

      rows.innerHTML = filtered.length
        ? filtered.map(([name, chinese, supported, symbol]) => `
          <tr>
            <td class="vendor">${name}</td>
            <td>${pill(chinese)}</td>
            <td>${pill(supported)}</td>
            <td>${pill(gigabitOrFasterVendors.has(name))}</td>
            <td><code>${symbol}</code></td>
          </tr>
        `).join("")
        : `<tr><td class="empty" colspan="5">No vendors match the current filters.</td></tr>`;

      count.textContent = `${filtered.length} / ${vendors.length}`;
    }

    search.addEventListener("input", render);
    chineseOnly.addEventListener("change", render);
    supportedOnly.addEventListener("change", render);
    render();

</html>
